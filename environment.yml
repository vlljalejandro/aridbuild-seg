name: aridbuild-seg
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch=2.4.*
  - torchvision=0.19.*
  - pytorch-cuda=12.1
  - numpy=1.26.*
  - pandas=2.2.*
  - pillow=10.*
  - scikit-image=0.24.*   # watershed behaviour changes between minor versions
  - geopandas=1.0.*
  - shapely=2.0.*
  - fiona=1.10.*
  - rasterio=1.4.*
  - jupyterlab
  - pyarrow=17.*
  - python-lmdb=1.5.*
  - matplotlib=3.9.*
  - pyyaml=6.*
  - tqdm
  - pip
  - pip:
      # Conda runs this section with `pip -U`, so without repeating the numpy
      # pin pip pulls 2.x and breaks the ABI for rasterio, geopandas and torch.
      # The failure is a segfault at import, not a resolver error.
      - numpy==1.26.4
      - albumentations==1.4.21   # GaussNoise took `std_range` here
      # pulled in via albumentations. 5.1.2 ships no Windows wheel and builds
      # from source, which needs MSVC; 5.1.1 has wheels everywhere.
      - stringzilla==5.1.1
      - timm==1.0.11
      - transformers==4.46.*
      - pycocotools==2.0.8
      - wandb==0.18.*
      - pytest>=7,<10
