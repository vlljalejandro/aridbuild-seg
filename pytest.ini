[pytest]
testpaths = tests
addopts = -q

filterwarnings =
    # Fail on warnings from our own code -- a DeprecationWarning in src/ is a
    # real signal and should not scroll past unnoticed.
    error
    default

    # matplotlib 3.9 calls pyparsing APIs that newer pyparsing deprecates.
    # Third-party version skew, nothing fixable here.
    ignore:.*oneOf.*:DeprecationWarning
    ignore:.*parseString.*:DeprecationWarning
    ignore:.*resetCache.*:DeprecationWarning
    ignore::DeprecationWarning:matplotlib.*
    ignore::DeprecationWarning:pyparsing.*
